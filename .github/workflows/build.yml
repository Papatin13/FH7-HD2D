name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  # The Windows game core (fe7hd.dll), built natively with MSVC.
  core-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the game core for Windows (no ROM code)
        working-directory: core
        env:
          # link the C runtime statically: players need no Visual C++ redistributable
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release -p fe7hd

      - uses: actions/upload-artifact@v4
        with:
          name: fe7hd-dll
          path: core/target/release/fe7hd.dll

  # Linux core, then the Godot exports for Linux and Windows, AppImage and archives.
  package:
    runs-on: ubuntu-22.04
    needs: core-windows
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-${{ hashFiles('core/Cargo.lock') }}

      - name: Build the game core (no ROM code)
        run: tools/build.sh

      - name: Tests
        working-directory: core
        run: cargo test --release -p gba -p fe7hd

      - uses: actions/download-artifact@v4
        with:
          name: fe7hd-dll
          path: godot/bin

      - name: Download Godot 4.5.1 and its export templates
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          python3 tools/fetch_templates.py linux windows

      - name: Build the packages
        run: |
          VER="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) VER="dev-${GITHUB_SHA::7}" ;; esac
          tools/package.sh ./Godot_v4.5.1-stable_linux.x86_64 "$VER"

      - uses: actions/upload-artifact@v4
        with:
          name: FE7-HD2D
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.zip
